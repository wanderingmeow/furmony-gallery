<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="572" viewBox="0 0 1280 572" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What the first screen costs</title>
  <style>
    @keyframes grow { from { width: 0 } to { width: var(--w) } }
    @keyframes show { from { opacity: 0 } to { opacity: 1 } }
    .bar { animation: grow .7s cubic-bezier(.2,.7,.2,1) both }
    .said { animation: show .5s ease-out both }
    @keyframes slam {
      0% { opacity: 0; transform: scale(1.1) }
      62% { opacity: 1; transform: scale(.985) }
      100% { opacity: 1; transform: scale(1) }
    }
    .hero {
      transform-box: fill-box; transform-origin: 0% 50%;
      animation: slam .62s cubic-bezier(.16,1,.3,1) 1.35s both;
    }
    @media (prefers-reduced-motion: reduce) {
      .bar, .said, .hero { animation: none }
    }
  </style>
  <desc id="d">First paint: the official site 31.01 MB, here 3.64 MB, and 0.5 MB after the first visit. The 22 covers above the fold: 14.05 MB of originals against 1.01 MB sized for the box.</desc>
  <rect x="1" y="1" width="1278" height="570" rx="24" fill="#121212" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="48" y="54" fill="#737373" font-size="14" font-weight="700" letter-spacing="2.4">FIRST PAINT</text>
  <text x="48" y="93.0" fill="#a3a3a3" font-size="19">the Furmony official site</text>
  <rect class="bar" style="--w:720px;animation-delay:0.10s" x="400" y="75" width="720" height="24" rx="6" fill="#404040"/>
  <text class="said" style="animation-delay:0.10s" x="1134" y="93.0" fill="#a3a3a3" font-size="19">31.01 MB</text>
  <text x="48" y="137.0" fill="#f5f5f5" font-size="19">Furmony Gallery, first visit</text>
  <rect class="bar" style="--w:85px;animation-delay:0.19s" x="400" y="119" width="85" height="24" rx="6" fill="#f97316"/>
  <text class="said" style="animation-delay:0.19s" x="499" y="137.0" fill="#a3a3a3" font-size="19">3.64 MB</text>
  <text x="48" y="181.0" fill="#f5f5f5" font-size="19">Furmony Gallery, after the first visit</text>
  <rect class="bar" style="--w:12px;animation-delay:0.28s" x="400" y="163" width="12" height="24" rx="6" fill="#f97316"/>
  <text class="said" style="animation-delay:0.28s" x="426" y="181.0" fill="#a3a3a3" font-size="19">0.50 MB</text>
  <text x="48" y="240" fill="#737373" font-size="14" font-weight="700" letter-spacing="2.4">THE 22 COVERS ABOVE THE FOLD</text>
  <text x="48" y="279.0" fill="#a3a3a3" font-size="19">the originals</text>
  <rect class="bar" style="--w:326px;animation-delay:0.37s" x="400" y="261" width="326" height="24" rx="6" fill="#404040"/>
  <text class="said" style="animation-delay:0.37s" x="740" y="279.0" fill="#a3a3a3" font-size="19">14.05 MB</text>
  <text x="48" y="323.0" fill="#f5f5f5" font-size="19">optimized</text>
  <rect class="bar" style="--w:23px;animation-delay:0.46s" x="400" y="305" width="23" height="24" rx="6" fill="#f97316"/>
  <text class="said" style="animation-delay:0.46s" x="437" y="323.0" fill="#a3a3a3" font-size="19">1.01 MB</text>
  <text x="48" y="370" fill="#737373" font-size="15">Measured November 2026 on the same network, before the first screen draws</text>
  <text class="hero" x="48" y="498" fill="#f5f5f5" font-size="104" font-weight="800" letter-spacing="-5">8.5&#215;</text>
  <text class="said" style="animation-delay:1.5s" x="348" y="488" fill="#a3a3a3" font-size="26">less to pull before the first screen draws</text>
