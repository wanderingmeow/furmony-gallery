<html lang="zh-CN">
<head>

<title>青春撸管生活宾果 🎰</title>
<style>
:root{
  --felt:#0d0715; --felt2:#160c24; --line:#3a2a55; --gold:#ffd76a; --gold2:#ff9f1c;
  --neon:#ff2d95; --cyan:#39e6ff; --ink:#f6f2ff; --dim:#9c8fb8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--felt);margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink); overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px calc(30px + env(safe-area-inset-bottom))}
.hide{display:none !important}

/* ---------- 门 ---------- */
.gate{position:fixed;top:0;right:0;bottom:0;left:0;background:#0a0512;z-index:80;display:grid;padding:24px;overflow:auto}
.gate-card{margin:auto}   /* 用 margin:auto 居中：矮屏能滚，又不用 safe 关键字 */
.gate-card{width:100%;max-width:400px;text-align:center}
.gate h2{font-size:30px;font-weight:900;margin:0 0 14px;letter-spacing:-.02em}
.gate p{font-size:14px;line-height:1.75;color:var(--dim);margin:0 0 22px}
.minor{margin-top:14px;font-size:12.5px;color:#ff5c7a;font-weight:800}

/* ---------- 顶栏 ---------- */
/* ---------- 霓虹标题 ---------- */
.hero{text-align:center;padding:24px 0 4px}
.neon{
  color:var(--gold);
  text-shadow:0 0 6px rgba(255,215,106,.9),0 0 22px rgba(255,159,28,.55),0 0 46px rgba(255,45,149,.35);
  animation:flick 4.5s infinite;
}
.hero h1{margin:0;font-size:30px;font-size:clamp(26px,7.6vw,38px);font-weight:900;letter-spacing:-.02em;line-height:1.15}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.55}95%{opacity:1}96.5%{opacity:.7}}
.hero .sub{margin-top:8px;font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--neon);
  text-shadow:0 0 10px rgba(255,45,149,.7)}

/* ---------- 跑马灯 ---------- */
.ticker{margin:14px -14px 16px;overflow:hidden;border-top:1px solid #2a1c40;border-bottom:1px solid #2a1c40;
  background:#100819;padding:7px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker span{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:800;letter-spacing:.05em;color:#c9b6f2;
  padding-left:100%;animation:roll 26s linear infinite}
@keyframes roll{to{transform:translateX(-100%)}}

/* ---------- 灯箱外框 + 灯泡 ---------- */
.frame{position:relative;padding:16px;border-radius:30px;background:linear-gradient(180deg,#1c1030,#120a1f);
  border:2px solid #45306a;box-shadow:0 22px 50px -22px rgba(0,0,0,.9),inset 0 0 30px rgba(255,45,149,.08)}
.ring{position:absolute;pointer-events:none}   /* inset 由 JS 按内边距算，灯居中在灯带里 */
.ring i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px 2px rgba(255,215,106,.85);animation:bulb 1.1s steps(1,end) infinite}
@keyframes bulb{0%,49%{opacity:1;box-shadow:0 0 9px 2px rgba(255,215,106,.9)}50%,100%{opacity:.22;box-shadow:0 0 3px 0 rgba(255,215,106,.3)}}

/* ---------- 盘面 ---------- */
.board{position:relative;display:grid;grid-template-columns:repeat(5,1fr);grid-gap:6px;gap:6px;background:#0b0614;
  border-radius:12px;padding:8px;border:1px solid #2c1e44}
.cell{
  position:relative;display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:64px;padding:5px 4px;border-radius:8px;border:1px solid #2f2347;
  background:linear-gradient(180deg,#faf7ff,#e9e2f7);color:#191024;
  font-size:11px;font-size:clamp(9.5px,2.55vw,11.5px);font-weight:800;line-height:1.3;cursor:pointer;
  transition:transform .12s,filter .16s;overflow:hidden;
}
.cell:active{transform:translateY(1px) scale(.98)}
.cell.on{
  background:linear-gradient(180deg,#3b2a10,#241907);color:var(--gold);
  border-color:#7a5a1c;box-shadow:inset 0 0 0 1px rgba(255,215,106,.25),0 0 14px -2px rgba(255,159,28,.55);
}
.cell.on:after{content:"✔";position:absolute;top:2px;right:3px;font-size:8px;color:var(--gold2)}
.cell.pop{animation:pop .34s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.cell.hot{outline:2px solid var(--gold);outline-offset:-2px;
  box-shadow:0 0 20px rgba(255,215,106,.6);z-index:2;filter:brightness(1.15)}
.cell.land{animation:land .45s cubic-bezier(.2,.9,.3,1.5)}
.cell.hot.land{outline-width:3px;box-shadow:0 0 26px rgba(255,215,106,.9),0 0 46px rgba(255,159,28,.5)}
.cell.zap{animation:zap .52s ease}
@keyframes zap{0%{filter:brightness(1)}28%{filter:brightness(1.95) saturate(1.35);box-shadow:0 0 28px rgba(255,215,106,.95)}100%{filter:brightness(1)}}
@keyframes land{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 连线层 */
#lines{position:absolute;left:8px;right:8px;top:8px;bottom:8px;width:calc(100% - 16px);height:calc(100% - 16px);
  pointer-events:none;overflow:visible}
#lines line{stroke:var(--neon);stroke-width:5;stroke-linecap:round;opacity:.92;
  filter:drop-shadow(0 0 3px rgba(255,45,149,.95)) drop-shadow(0 0 10px rgba(255,45,149,.55));
  animation:draw .55s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- 计分板 ---------- */
.board-panel{margin-top:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  background:#130b21;border:1px solid #2c1e44;border-radius:14px;padding:12px 14px}
.stats{display:grid;grid-gap:12px;gap:12px}
.qrplate{justify-self:center;background:#fff;border-radius:10px;padding:5px;line-height:0;
  box-shadow:0 0 0 1px rgba(255,215,106,.55),0 0 22px -6px rgba(255,159,28,.35),0 8px 20px -10px rgba(0,0,0,.9)}
#qrMini{display:block;width:100px;height:100px;image-rendering:pixelated}
.stat{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--dim)}
.stat b{display:block;font-size:22px;letter-spacing:-.02em;color:var(--gold);margin-top:3px}
.stat.lit b{color:var(--neon);text-shadow:0 0 12px rgba(255,45,149,.7)}
.title-box{min-width:0;text-align:right}
.title-box .t{font-size:17px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
.title-box .s{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--dim);margin-top:4px}
.bar{height:8px;border-radius:999px;background:#241735;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#8a4a00,#ff9f1c,#ffd76a);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.roast{margin-top:12px;font-size:13px;line-height:1.7;color:#cbbde6}

/* ---------- 按钮 ---------- */
.btns{display:grid;grid-template-columns:1fr;grid-gap:10px;gap:10px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:50px;border:0;
  border-radius:999px;font-weight:900;font-size:15px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.btn-jack{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1005;
  box-shadow:0 12px 28px -12px rgba(255,159,28,.7)}
.btn-jack:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;transform:translateX(-120%);
  background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%)}
.btn-jack:hover:after{animation:sheen 1s ease}
@keyframes sheen{to{transform:translateX(120%)}}
.btn-ghost{background:#181026;border:1px solid #3a2a55;color:#e6dcff;font-weight:800}
.btn-ghost:hover{border-color:#5c4585;color:#fff}
.btns .row2{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px}
.btn-dim{background:#120b1d;border-color:#2a1e40;color:#7e719b;min-height:44px;font-size:14px}

/* ---------- 脚注 / toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:#1d1230;border:1px solid #5c4585;color:#fff;font-size:13px;font-weight:800;padding:11px 16px;
  border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:70}

/* ---------- JACKPOT 大字 ---------- */
#jack{position:fixed;top:0;right:0;bottom:0;left:0;z-index:95;display:grid;align-items:center;justify-items:center;
  background:rgba(10,4,20,.86);text-align:center;
  transition:opacity .45s ease}
#jack.out{opacity:0;pointer-events:none}
#jack .j{font-size:52px;font-size:clamp(40px,13vw,68px);font-weight:900;letter-spacing:-.03em;color:var(--gold);
  text-shadow:0 0 14px rgba(255,215,106,.9),0 0 40px rgba(255,45,149,.6);animation:big .7s cubic-bezier(.2,.9,.3,1.5)}
#jack .p{margin-top:10px;font-size:13px;font-weight:900;letter-spacing:.2em;color:var(--neon)}
@keyframes big{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@media (max-width:340px){.cell{min-height:58px}}
@media (max-width:300px){
  .board-panel{grid-template-columns:auto 1fr}
  .qrplate{grid-column:1 / -1;order:3;margin-top:4px}
}
</style>
</head>
<body class="wrap">

<div id="gate" class="gate">

</div>

<div class="ticker"><span>🎰 中一格点一格 · 横竖斜都算线 · 12 条全连叫通杀 · 勾选只活在这一个页面，刷新即焚 · 投屏前想三秒 · 图一乐，拿去评价人就没意思了 · 🎰 中一格点一格 · 横竖斜都算线 · 12 条全连叫通杀 · 刷新即焚</span></div>

<div class="frame">

</div>

  </div>

    <div class="t" id="sTitle">观众席</div>

<script>
var CELLS = [
  '初中开始撸','一周撸五次','靠想象撸过','尝试戒撸多次','有三种以上的性癖',
  '拥有多种资源','不撸浑身难受','用玩具撸过','从没遗过精','二三次元都撸',
  '打算一直撸到老','在室外撸过','压力大的时候撸','开心的时候撸','难受的时候撸',
  '一天撸过多次','有百撸不厌的资源','经常有色情幻想','小头控制过大头','撸完精神萎靡',
  '没实战过','对着现实的人撸过','半夜起床撸过','早上晨勃撸过','撸后尿道刺痛'
];

/* 12 条线：5 横 + 5 竖 + 2 斜 */
var LINES = [];
(function(){
  var r,c,ix;
  for(r=0;r<5;r++){ ix=[]; for(c=0;c<5;c++) ix.push(r*5+c); LINES.push({cells:ix}); }
  for(c=0;c<5;c++){ ix=[]; for(r=0;r<5;r++) ix.push(r*5+c); LINES.push({cells:ix}); }
  LINES.push({cells:[0,6,12,18,24]});
  LINES.push({cells:[4,8,12,16,20]});
})();

var TIERS = [
  { max:0,  name:'观众席',   sub:'SITTING OUT',      roast:'牌面摊开一格没中。你来这儿是查资料的吧。' },
  { max:2,  name:'试水筹码', sub:'BUY IN',           roast:'中了不到三条线，属于刚换好筹码、还没摸清牌桌的人。' },
  { max:4,  name:'上桌了',   sub:'SEATED',           roast:'这几格连起来，说明你的日常已经有点规律了，规律得挺熟练。' },
  { max:6,  name:'荷官眼熟你', sub:'REGULAR DEALER', roast:'线连到五六条，荷官开始记得你的手感。这时候的问题不是玩不玩，是玩得太有心得。' },
  { max:8,  name:'常客',     sub:'HIGH ROLLER',      roast:'八条线，你的经历已经能排班了。别人是偶尔手痒，你是一套应对机制。' },
  { max:11, name:'高轮区',   sub:'VIP LOUNGE',       roast:'剩下的格子全是运气问题，不是你不想中，是有些格子确实需要一点缘分。' },
  { max:12, name:'通杀',     sub:'JACKPOT · SWEEP',  roast:'12 条全连。兄弟，这张牌对你来说不是测试，是履历表。' }
];

var NS = 'http://www.w3.org/2000/svg';
/* 端点直接量首末格的实际格心，再沿线方向甩出头一点，
   所以第 0 列、第 4 列、首末行都不会歪到格子外面 */
function center(i){
  var c = document.querySelector('.cell[data-i="' + i + '"]').getBoundingClientRect();
  var s = document.getElementById('lines').getBoundingClientRect();
  return [c.left + c.width/2 - s.left, c.top + c.height/2 - s.top];
}
function drawLine(k, animate){
  var L = LINES[k], a = center(L.cells[0]), b = center(L.cells[4]);
  var dx = b[0]-a[0], dy = b[1]-a[1], len = Math.sqrt(dx*dx + dy*dy) || 1;
  var ex = dx/len*13, ey = dy/len*13;
  var x1 = a[0]-ex, y1 = a[1]-ey, x2 = b[0]+ex, y2 = b[1]+ey;
  var span = Math.sqrt(Math.pow(x2-x1,2) + Math.pow(y2-y1,2));
  var ln = document.createElementNS(NS, 'line');
  ln.setAttribute('data-k', k);
  ln.setAttribute('x1', x1.toFixed(1)); ln.setAttribute('y1', y1.toFixed(1));
  ln.setAttribute('x2', x2.toFixed(1)); ln.setAttribute('y2', y2.toFixed(1));
  if (animate){
    ln.style.strokeDasharray = span.toFixed(1);
    ln.style.strokeDashoffset = span.toFixed(1);
  } else {
    ln.style.animation = 'none';
  }
  document.getElementById('lines').appendChild(ln);
  return ln;
}
function completeLines(){
  var out = [], i, j, full;
  for(i=0;i<LINES.length;i++){
    full = true;
    for(j=0;j<5;j++){ if (!on[LINES[i].cells[j]]){ full = false; break; } }
    if (full) out.push(i);
  }
  return out;
}

var on = {};          /* 命中状态，只活在内存 */
var drawn = {};       /* 已画的线 */
var litCount = 0;     /* 已亮线数 */

/* ---------- 灯泡 ---------- */
/* 灯沿「圆角矩形」这条路径排，不是沿方框。
   路径 = 4 段直边 + 4 段 1/4 圆弧，半径跟外框圆角同步内缩，
   所以转角处的灯跟着弧凹进去，不会戳在直角尖上。 */
function layoutBulbs(){
  var f = document.querySelector('.frame'), ring = document.getElementById('ring');
  ring.innerHTML = '';
  var cs = getComputedStyle(f);
  var pad = parseFloat(cs.paddingLeft) || 16;      /* 灯带 = 边框到盘面之间这条边 */
  var bord = parseFloat(cs.borderTopWidth) || 2;
  var INSET = pad/2;                                 /* 取正中，灯不贴框也不贴盘 */
  ring.style.top = ring.style.right = ring.style.bottom = ring.style.left = INSET + 'px';
  var W = f.clientWidth - INSET*2, H = f.clientHeight - INSET*2;
  var R = Math.max(4, (parseFloat(cs.borderTopLeftRadius) || 20) - bord - INSET);
  if (R > Math.min(W,H)/2) R = Math.min(W,H)/2;
  var arc = Math.PI*R/2, eW = W-2*R, eH = H-2*R;
  var segs = [
    {t:'a', cx:R,   cy:R,   a0:Math.PI,     a1:Math.PI*1.5, len:arc},
    {t:'h', y:0,    x0:R,   x1:W-R,         len:eW},
    {t:'a', cx:W-R, cy:R,   a0:Math.PI*1.5, a1:Math.PI*2,   len:arc},
    {t:'v', x:W,    y0:R,   y1:H-R,         len:eH},
    {t:'a', cx:W-R, cy:H-R, a0:0,           a1:Math.PI*.5,  len:arc},
    {t:'h', y:H,    x0:W-R, x1:R,           len:eW},
    {t:'a', cx:R,   cy:H-R, a0:Math.PI*.5,  a1:Math.PI,     len:arc},
    {t:'v', x:0,    y0:H-R, y1:R,           len:eH}
  ];
  function pt(sg, k){
    if (sg.t === 'a'){ var a = sg.a0 + k*(sg.a1-sg.a0); return [sg.cx + R*Math.cos(a), sg.cy + R*Math.sin(a)]; }
    if (sg.t === 'h'){ return [sg.x0 + k*(sg.x1-sg.x0), sg.y]; }
    return [sg.x, sg.y0 + k*(sg.y1-sg.y0)];
  }
  var per = 0, i, j, acc = 0, anch = [];
  for(i=0;i<segs.length;i++){
    if (segs[i].t === 'a') anch.push(acc + segs[i].len/2);   /* 每个转角弧的正中，钉一颗角灯 */
    acc += segs[i].len;
  }
  per = acc;
  /* 四颗角灯钉死后，把「角灯到角灯」这段弧长等分塞灯。
     不再给角灯留让位窗口，所以整圈直线间距基本一致 */
  var n = Math.max(8, Math.round(per/22)), target = per/n, ds = anch.slice();
  for(i=0;i<anch.length;i++){
    var a0 = anch[i], span = (anch[(i+1)%anch.length] - a0 + per) % per;
    var k = Math.max(0, Math.round(span/target) - 1);
    for(j=1;j<=k;j++) ds.push((a0 + span*j/(k+1)) % per);
  }
  ds.sort(function(x,y){ return x-y; });
  for(i=0;i<ds.length;i++){
    var d = ds[i], sg = segs[segs.length-1], frac = 1;
    for(j=0;j<segs.length;j++){ sg = segs[j]; if (d <= sg.len){ frac = d/sg.len; break; } d -= sg.len; }
    var p = pt(sg, frac), el = document.createElement('i');
    el.style.left = p[0].toFixed(1)+'px';
    el.style.top  = p[1].toFixed(1)+'px';
    el.style.animationDelay = (i%2 ? '0.55s' : '0s');
    ring.appendChild(el);
  }
}

/* ---------- 盘面 ---------- */
function buildBoard(){
  var box = document.getElementById('cells'), html = '', i;
  for(i=0;i<25;i++) html += '<button class="cell" data-i="'+i+'" onclick="toggle(this)">'+CELLS[i]+'</button>';
  box.innerHTML = html;
}
function toggle(el, silent){
  var i = +el.getAttribute('data-i');
  if (on[i]){ delete on[i]; el.classList.remove('on'); }
  else { on[i] = 1; el.classList.add('on','pop'); setTimeout(function(){ el.classList.remove('pop'); }, 360); }
  refresh();
}
function clearAll(){
  on = {}; litCount = 0;
  document.getElementById('lines').innerHTML = ''; drawn = {};
  hideJack();
  var cs = document.querySelectorAll('.cell'), i;
  for(i=0;i<cs.length;i++) cs[i].classList.remove('on');
  refresh(); toast('牌面清空，重新下注');
}
function shuffleCells(){
  var i, j, t;
  for(i=CELLS.length-1;i>0;i--){ j = Math.floor(Math.random()*(i+1)); t=CELLS[i]; CELLS[i]=CELLS[j]; CELLS[j]=t; }
}
function resetBoard(){
  on = {}; litCount = 0;
  document.getElementById('lines').innerHTML = ''; drawn = {};
  hideJack();
  buildBoard(); refresh();
}
function randomCard(){
  /* 换一张牌 = 打乱格子顺序，词还是那 25 个词 */
  shuffleCells(); resetBoard(); toast('新牌已洗，旧账一笔勾销');
}

/* ---------- 计分 ---------- */
function refresh(){
  var hits = Object.keys(on).length, i, lit = completeLines();
  /* 只画新连成的线，已亮的不动，取消勾选的线撤掉 */
  Object.keys(drawn).forEach(function(k){ if (lit.indexOf(+k) < 0){ drawn[k].parentNode.removeChild(drawn[k]); delete drawn[k]; } });
  lit.forEach(function(k){
    if (drawn[k]) return;
    var L = LINES[k], ln = drawLine(k, true);
    drawn[k] = ln;
    /* 线一画出来，线上五格从左到右接力闪一下 */
    L.cells.forEach(function(ci, ci_i){
      var cell = document.querySelector('.cell[data-i="' + ci + '"]');
      if (!cell) return;
      setTimeout(function(){
        cell.classList.add('zap');
        setTimeout(function(){ cell.classList.remove('zap'); }, 540);
      }, 90 + ci_i * 78);
    });
  });

  var tier = TIERS[TIERS.length-1];
  for(i=0;i<TIERS.length;i++){ if (lit.length <= TIERS[i].max){ tier = TIERS[i]; break; } }

  document.getElementById('sHit').textContent = hits + '/25';
  document.getElementById('sLine').textContent = lit.length + '/12';
  document.getElementById('sTitle').textContent = tier.name;
  document.getElementById('sSub').textContent = tier.sub;
  document.getElementById('sRoast').textContent = tier.roast;
  document.getElementById('barFill').style.width = (lit.length/12*100) + '%';

  if (lit.length > litCount){
    if (lit.length === 12){ showJack(); confetti(90); }
    else { toast('连成 ' + lit.length + ' 条线 · ' + tier.name); confetti(26); }
  }
  litCount = lit.length;
}

/* ---------- 手气 ---------- */
var rolling = false;
function luck(){
  if (rolling) return;
  var free = [], i;
  for(i=0;i<25;i++) if (!on[i]) free.push(i);
  if (!free.length){ toast('牌面已经点满，没有手气了'); return; }
  var target = free[Math.floor(Math.random()*free.length)];
  var btn = document.getElementById('luckBtn');
  rolling = true; btn.disabled = true;
  var hops = [], n = 12, k;
  for(k=0;k<n-1;k++) hops.push(free[Math.floor(Math.random()*free.length)]);
  hops.push(target);                       /* 最后一跳必定落在抽中的那格 */
  var cur = null, step = 0;
  function tick(){
    if (cur) cur.classList.remove('hot');
    var idx = hops[step];
    var el = document.querySelector('.cell[data-i="'+idx+'"]');
    if (step === n-1){
      /* 黄框先停在这格，等一拍，下一拍才翻成暗金标记 */
      el.classList.add('hot');
      setTimeout(function(){
        el.classList.remove('hot');
        el.classList.add('land');
        toggle(el);
        setTimeout(function(){ el.classList.remove('land'); }, 460);
        toast('手气落在：' + CELLS[idx]);
        rolling = false; btn.disabled = false;
      }, 520);
      return;
    }
    el.classList.add('hot'); cur = el;
    step++;
    setTimeout(tick, 70 + step*step*2.2);   /* 越跳越慢 */
  }
  tick();
}

/* ---------- 特效 ---------- */
var jackTimer;
function showJack(){
  var j = document.getElementById('jack');
  j.classList.remove('out'); j.classList.remove('hide');
  clearTimeout(jackTimer);
  jackTimer = setTimeout(hideJack, 2400);   /* 停 2.4s 自己收 */
}
function hideJack(){
  clearTimeout(jackTimer);
  var j = document.getElementById('jack');
  if (j.classList.contains('hide')) return;
  j.classList.add('out');                                   /* 先淡出 */
  setTimeout(function(){ j.classList.add('hide'); j.classList.remove('out'); }, 470);  /* 再摘掉 */
}
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2100);
}
function confetti(n){
  var colors = ['#ffd76a','#ff2d95','#39e6ff','#ff9f1c','#fff'];
  if (!document.createElement('div').animate) return;   /* 老 WebKit 没 WAAPI，跳过特效 */
  for(var k=0;k<n;k++){
    var s = document.createElement('div');
    s.className='spark';
    s.style.left = (Math.random()*innerWidth)+'px'; s.style.top = '-12px';
    s.style.background = colors[k%colors.length];
    document.body.appendChild(s);
    s.animate([{transform:'translate(-50%,0) rotate(0)',opacity:1},
               {transform:'translate(-50%,'+(innerHeight+40)+'px) rotate('+(Math.random()*720-360)+'deg)',opacity:.9}],
              {duration:1400+Math.random()*1200, delay:Math.random()*500, easing:'linear'}).onfinish=function(){ this.effect.target.remove(); };
  }
}

/* ---------- 二维码（本地烘焙，不联网，页面上不出现明文链接） ---------- */
/* 码里编的是 https://wanderingmeow.github.io/furmony-gallery/bingo.html
   v4 · EC-L · 33x33。换部署地址必须重新生成 QR_BITS，页面上搜不到别的副本 */
var QR_N = 33;
var QR_BITS = '111111100100000111111101001111111100000101101100000000000001000001101110100111001010101100001011101101110101101000001010000001011101101110100010111100111001001011101100000101010011100001010101000001111111101010101010101010101111111000000000000110110000100100000000111110111110101001000011110101010001111001100000010011001001000111100000111101100111101100111001010101111000111001110111110001110100110000111101000001000010010111000001001011110111011011001001000011110010100100011100101010010110010111111011110110110001110111100100010110111110101111110001110010010111101011110000011110001001001011111111100101100101001010011001010000000011011001100000111010000100001100110001000001011010110110010110110010010111010111101001001011101001101010011101100010110101010101010010100110010111101010001100100110111010101001010011111111001000000001010000001111110100011101111111101001100110101111101011010100000100111001010011110100011101101110101001000001010010111110001101110101110111011111111010110111101110101110011111001001101001100100000101110110010101101011111100111111101110101101010011111010010';
function drawMiniQR(){
  var c = document.getElementById('qrMini'); if (!c || !c.getContext) return;
  var x = c.getContext('2d'), S = c.width, q = 2, u = S/(QR_N + q*2), r, cc;
  x.fillStyle = '#fff'; x.fillRect(0,0,S,S);
  x.fillStyle = '#141019';
  for(r=0;r<QR_N;r++) for(cc=0;cc<QR_N;cc++)
    if (QR_BITS[r*QR_N+cc] === '1')
      x.fillRect(Math.floor((cc+q)*u), Math.floor((r+q)*u), Math.ceil(u), Math.ceil(u));
}

/* ---------- 门 ---------- */
function enterGate(ok){
  document.getElementById('gate').classList.add('hide');
  if (!ok){ document.getElementById('minor').classList.remove('hide'); return; }
  document.activeElement && document.activeElement.blur();
  document.documentElement.scrollTop = document.body.scrollTop = 0;
  window.scrollTo(0,0);
  layoutBulbs();
}

/* ---------- 启动 ---------- */
shuffleCells();
buildBoard();
drawMiniQR();
refresh();
layoutBulbs();
function relayoutLines(){
  document.getElementById('lines').innerHTML = ''; drawn = {};
  completeLines().forEach(function(k){ drawn[k] = drawLine(k, false); });
}
var rsTimer;
window.addEventListener('resize', function(){ layoutBulbs(); clearTimeout(rsTimer); rsTimer = setTimeout(relayoutLines, 120); });
</script>
